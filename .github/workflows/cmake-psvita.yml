name: Build PSVita (CMake)

on:
  push:
    branches: [ vita ]
  pull_request:
    branches: [ vita ]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      VITASDK: ${{ github.workspace }}/vitasdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: Verify release version consistency
        run: python3 tools/check-version-consistency.py

      - name: Test privacy-safe support-log summarizer
        run: python3 tools/summarize-vita-log.py --self-test

      - name: Test VitaSDK dependency resolver
        run: python3 tools/fetch-vitasdk-packages.py --self-test

      - name: Set up dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake make python3 python3-pip curl git

      - name: Clean up old VitaSDK if present
        run: |
          rm -rf $GITHUB_WORKSPACE/vitasdk

      - name: Install pinned VitaSDK and verified packages
        run: |
          set -euo pipefail

          sdk_archive="$RUNNER_TEMP/vitasdk.tar.bz2"
          sdk_url="https://github.com/vitasdk/autobuilds/releases/download/master-linux-v2.540/vitasdk-x86_64-linux-gnu-2026-05-24_12-05-02.tar.bz2"
          sdk_sha256="b1a8f4d6e41460c9ecf2c3c4590eb7eb3ea6b690767f508bd5696dbc77a4272e"
          curl --fail --location --retry 3 --output "$sdk_archive" "$sdk_url"
          echo "$sdk_sha256  $sdk_archive" | sha256sum --check --strict

          mkdir -p "$VITASDK"
          tar xjf "$sdk_archive" -C "$VITASDK" --strip-components=1
          export PATH="$VITASDK/bin:$PATH"

          vdpm_commit="e423be457622a9ba517858f4831566dcd263729a"
          git clone --filter=blob:none --no-checkout https://github.com/vitasdk/vdpm.git "$RUNNER_TEMP/vdpm"
          git -C "$RUNNER_TEMP/vdpm" checkout --detach "$vdpm_commit"
          test "$(git -C "$RUNNER_TEMP/vdpm" rev-parse HEAD)" = "$vdpm_commit"

          package_dir="$RUNNER_TEMP/vitasdk-packages"
          mkdir -p "$package_dir"
          dependency_manifest="$GITHUB_WORKSPACE/vitasdk-dependencies.json"
          python3 tools/fetch-vitasdk-packages.py \
            --output-dir "$package_dir" \
            --manifest "$dependency_manifest"
          python3 -c \
            'import json, sys; print("\n".join(a["name"] for a in json.load(open(sys.argv[1], encoding="utf-8"))["assets"]))' \
            "$dependency_manifest" |
            while IFS= read -r asset_name; do
              "$RUNNER_TEMP/vdpm/vdpm" -f "$package_dir/$asset_name"
            done

          test -f "$VITASDK/share/vita.toolchain.cmake"
          echo "$VITASDK/bin" >> $GITHUB_PATH

      - name: Update submodules and build
        run: |
          cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE="${{ env.VITASDK }}/share/vita.toolchain.cmake"
          cd build
          make
          cp ../vitasdk-dependencies.json .

      - name: List build outputs
        run: |
          ls -lh build

      - name: Upload VPK artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: moonlight-vpk
          path: |
            build/*.vpk
            build/vitasdk-dependencies.json
          if-no-files-found: error
