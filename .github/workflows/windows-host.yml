name: Build Windows host companion

on:
  push:
    branches: [vita]
    paths:
      - "host/**"
      - "protocol/**"
      - "src/config.c"
      - "src/gui/ui_connect.c"
      - "src/gui/ui_settings.c"
      - "src/gui/ui_stream_overlay.c"
      - "libgamestream/client.c"
      - "CMakeLists.txt"
      - "CHANGELOG.md"
      - "README.md"
      - "LICENSE"
      - "docs/COMMUNITY_TESTING.md"
      - "docs/LOGGING_AND_SUPPORT.md"
      - "docs/VITA_SETTINGS_GUIDE.md"
      - "docs/BUILDING.md"
      - "docs/RELEASING.md"
      - "docs/CODE_SIGNING_POLICY.md"
      - "docs/CMakeLists.txt"
      - "docs/README.pod"
      - "PRIVACY.md"
      - "resources/changeinfo.xml"
      - "sce_sys/livearea/contents/template.xml"
      - "tools/check-version-consistency.py"
      - "tools/check-release-contract.py"
      - "tools/check-host-client-contract.py"
      - "tools/check-windows-upgrade-contract.py"
      - "tools/summarize-vita-log.py"
      - ".github/workflows/release.yml"
      - ".github/workflows/windows-host.yml"
  pull_request:
    branches: [vita]
    paths:
      - "host/**"
      - "protocol/**"
      - "src/config.c"
      - "src/gui/ui_connect.c"
      - "src/gui/ui_settings.c"
      - "src/gui/ui_stream_overlay.c"
      - "libgamestream/client.c"
      - "CMakeLists.txt"
      - "CHANGELOG.md"
      - "README.md"
      - "LICENSE"
      - "docs/COMMUNITY_TESTING.md"
      - "docs/LOGGING_AND_SUPPORT.md"
      - "docs/VITA_SETTINGS_GUIDE.md"
      - "docs/BUILDING.md"
      - "docs/RELEASING.md"
      - "docs/CODE_SIGNING_POLICY.md"
      - "docs/CMakeLists.txt"
      - "docs/README.pod"
      - "PRIVACY.md"
      - "resources/changeinfo.xml"
      - "sce_sys/livearea/contents/template.xml"
      - "tools/check-version-consistency.py"
      - "tools/check-release-contract.py"
      - "tools/check-host-client-contract.py"
      - "tools/check-windows-upgrade-contract.py"
      - "tools/summarize-vita-log.py"
      - ".github/workflows/release.yml"
      - ".github/workflows/windows-host.yml"
  workflow_dispatch:
  workflow_call:
    secrets:
      WINDOWS_CERTIFICATE_BASE64:
        required: false
      WINDOWS_CERTIFICATE_PASSWORD:
        required: false
      WINDOWS_EXPECTED_SIGNER_SUBJECT:
        required: false

permissions:
  contents: read

jobs:
  compatibility:
    name: self-test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - name: Verify release version consistency
        run: python tools/check-version-consistency.py
      - name: Verify release packaging and policy contract
        run: python tools/check-release-contract.py
      - name: Verify Vita/host compatibility contract
        run: python tools/check-host-client-contract.py
      - name: Verify safe in-place upgrade contract
        run: python tools/check-windows-upgrade-contract.py
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.423"
      - name: Build with warnings as errors
        run: dotnet build host/VitaMoonlight.Host/VitaMoonlight.Host.csproj --configuration Release
      - name: Portable logic self-test
        run: dotnet run --project host/VitaMoonlight.Host/VitaMoonlight.Host.csproj --configuration Release --no-build -- self-test

  build:
    runs-on: windows-2025
    env:
      IS_TAGGED_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
      IS_UNSIGNED_BETA_PREVIEW: ${{ github.repository == 'alex4580/vita-moonlight' && github.ref == 'refs/tags/v0.14.8-beta.1' }}
      HAS_WINDOWS_CERTIFICATE_DATA: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 != '' }}
      HAS_WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD != '' }}
      HAS_WINDOWS_EXPECTED_SIGNER_SUBJECT: ${{ secrets.WINDOWS_EXPECTED_SIGNER_SUBJECT != '' }}
      HAS_WINDOWS_SIGNING_CERTIFICATE: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.WINDOWS_CERTIFICATE_BASE64 != '' && secrets.WINDOWS_CERTIFICATE_PASSWORD != '' }}
      WINDOWS_EXPECTED_SIGNER_SUBJECT: ${{ secrets.WINDOWS_EXPECTED_SIGNER_SUBJECT }}
      INNO_SETUP_COMPILER: C:\Program Files (x86)\Inno Setup 6\ISCC.exe
      INNO_SETUP_VERSION: "6.7.3"
      INNO_SETUP_SHA256: 9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - name: Verify release version consistency
        run: python tools/check-version-consistency.py
      - name: Verify release packaging and policy contract
        run: python tools/check-release-contract.py
      - name: Verify Vita/host compatibility contract
        run: python tools/check-host-client-contract.py
      - name: Verify safe in-place upgrade contract
        run: python tools/check-windows-upgrade-contract.py
      - name: Select Windows release signing mode
        if: env.IS_TAGGED_RELEASE == 'true'
        shell: pwsh
        run: |
          if ($env:HAS_WINDOWS_CERTIFICATE_DATA -ne $env:HAS_WINDOWS_CERTIFICATE_PASSWORD) {
            throw 'Windows signing configuration is incomplete: configure both certificate secrets or neither.'
          }
          if ($env:IS_UNSIGNED_BETA_PREVIEW -eq 'true') {
            if ($env:GITHUB_REPOSITORY -ne 'alex4580/vita-moonlight' -or
                $env:GITHUB_REF -ne 'refs/tags/v0.14.8-beta.1') {
              throw 'Unsigned beta-preview context validation failed.'
            }
            if ($env:HAS_WINDOWS_CERTIFICATE_DATA -eq 'true' -or
                $env:HAS_WINDOWS_CERTIFICATE_PASSWORD -eq 'true' -or
                $env:HAS_WINDOWS_EXPECTED_SIGNER_SUBJECT -eq 'true') {
              throw 'The explicitly unsigned beta preview must not receive Windows signing secrets.'
            }
            $projectText = Get-Content -LiteralPath host/VitaMoonlight.Host/VitaMoonlight.Host.csproj -Raw
            $versionMatch = [regex]::Match($projectText, '<Version>([^<]+)</Version>')
            if (-not $versionMatch.Success -or $versionMatch.Groups[1].Value -ne '0.14.8') {
              throw 'The unsigned beta preview is restricted to project version 0.14.8.'
            }
            Write-Warning 'v0.14.8-beta.1 will be published unsigned. Windows will identify it as an unknown publisher.'
            @(
              '## Windows signing mode'
              ''
              'This exact beta preview is intentionally **unsigned**. The release'
              'workflow must add an Unknown publisher / SmartScreen warning and publish'
              'the signing-status manifest, checksums, and GitHub provenance attestations.'
            ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          }
          elseif ($env:HAS_WINDOWS_SIGNING_CERTIFICATE -ne 'true') {
            throw 'Every tagged release except v0.14.8-beta.1 requires both Windows signing certificate secrets.'
          }
          elseif ($env:HAS_WINDOWS_EXPECTED_SIGNER_SUBJECT -ne 'true') {
            throw 'Signed releases require WINDOWS_EXPECTED_SIGNER_SUBJECT.'
          }
          else {
            Write-Host 'This release will use Authenticode signing.'
          }
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.423"
      - name: Build
        run: dotnet build host/VitaMoonlight.Host/VitaMoonlight.Host.csproj --configuration Release
      - name: Self-test
        run: dotnet run --project host/VitaMoonlight.Host/VitaMoonlight.Host.csproj --configuration Release --no-build -- self-test
      - name: Publish
        run: dotnet publish host/VitaMoonlight.Host/VitaMoonlight.Host.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false --output artifacts/host
      - name: Restore host signing certificate
        if: env.HAS_WINDOWS_SIGNING_CERTIFICATE == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
        run: |
          $certificateBytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64)
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\vita-moonlight-signing.pfx", $certificateBytes)
      - name: Sign host companion
        if: env.HAS_WINDOWS_SIGNING_CERTIFICATE == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if ($null -eq $signTool) { throw "signtool.exe was not found." }
          & $signTool.FullName sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f "$env:RUNNER_TEMP\vita-moonlight-signing.pfx" /p $env:WINDOWS_CERTIFICATE_PASSWORD artifacts/host/VitaMoonlight.Host.exe
          if ($LASTEXITCODE -ne 0) { throw "Signing the host companion failed." }
      - name: Remove host signing certificate
        if: ${{ always() && env.HAS_WINDOWS_SIGNING_CERTIFICATE == 'true' }}
        shell: pwsh
        run: |
          $certificatePath = "$env:RUNNER_TEMP\vita-moonlight-signing.pfx"
          Remove-Item -LiteralPath $certificatePath -Force -ErrorAction SilentlyContinue
          if (Test-Path -LiteralPath $certificatePath) {
            throw "The temporary host signing certificate could not be removed."
          }
      - name: Test published executable
        run: artifacts/host/VitaMoonlight.Host.exe self-test
      - name: Prepare pinned signed display-driver bundle
        shell: pwsh
        run: host/installer/prepare-displaywizard.ps1
      - name: Prepare pinned ViGEmBus bundle
        shell: pwsh
        run: host/installer/prepare-vigembus.ps1
      - name: Prepare pinned Sunshine bundle
        shell: pwsh
        run: host/installer/prepare-sunshine.ps1
      - name: Install pinned Inno Setup
        shell: pwsh
        run: |
          $installerPath = "$env:RUNNER_TEMP\innosetup-$env:INNO_SETUP_VERSION.exe"
          $installerUri = "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe"
          try {
            Invoke-WebRequest -UseBasicParsing -Uri $installerUri -OutFile $installerPath
            $actualHash = (Get-FileHash -LiteralPath $installerPath -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualHash -ne $env:INNO_SETUP_SHA256) {
              throw "Inno Setup SHA-256 mismatch: expected $env:INNO_SETUP_SHA256, found $actualHash."
            }

            $process = Start-Process `
              -FilePath $installerPath `
              -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-') `
              -WindowStyle Hidden `
              -Wait `
              -PassThru
            if ($process.ExitCode -ne 0) {
              throw "Inno Setup $env:INNO_SETUP_VERSION installation failed with exit code $($process.ExitCode)."
            }
          }
          finally {
            Remove-Item -LiteralPath $installerPath -Force -ErrorAction SilentlyContinue
          }

          if (-not (Test-Path -LiteralPath $env:INNO_SETUP_COMPILER)) {
            throw "Inno Setup compiler was not installed at the pinned path: $env:INNO_SETUP_COMPILER"
          }
      - name: Build unsigned Windows installer
        if: env.HAS_WINDOWS_SIGNING_CERTIFICATE != 'true'
        shell: pwsh
        run: |
          & $env:INNO_SETUP_COMPILER "host\installer\VitaMoonlightHost.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "Building the unsigned Windows installer failed."
          }
      - name: Restore installer signing certificate
        if: env.HAS_WINDOWS_SIGNING_CERTIFICATE == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
        run: |
          $certificateBytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64)
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\vita-moonlight-signing.pfx", $certificateBytes)
      - name: Build signed Windows installer and uninstaller
        if: env.HAS_WINDOWS_SIGNING_CERTIFICATE == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if ($null -eq $signTool) { throw "signtool.exe was not found." }

          $powerShell = Get-Command pwsh.exe -ErrorAction Stop
          $signingWrapper = "$env:RUNNER_TEMP\vita-moonlight-inno-sign.ps1"
          $signingLog = "$env:RUNNER_TEMP\vita-moonlight-inno-sign-targets.txt"
          $env:VITA_MOONLIGHT_SIGNTOOL_PATH = $signTool.FullName
          $env:VITA_MOONLIGHT_CERTIFICATE_PATH = "$env:RUNNER_TEMP\vita-moonlight-signing.pfx"
          $env:VITA_MOONLIGHT_INNO_SIGN_LOG = $signingLog

          @'
          param(
            [Parameter(Mandatory = $true)]
            [string] $FilePath
          )

          $ErrorActionPreference = 'Stop'
          $signToolPath = $env:VITA_MOONLIGHT_SIGNTOOL_PATH
          $certificatePath = $env:VITA_MOONLIGHT_CERTIFICATE_PATH
          $certificatePassword = $env:WINDOWS_CERTIFICATE_PASSWORD
          $signingLog = $env:VITA_MOONLIGHT_INNO_SIGN_LOG

          if ([string]::IsNullOrWhiteSpace($signToolPath) -or
              [string]::IsNullOrWhiteSpace($certificatePath) -or
              [string]::IsNullOrWhiteSpace($certificatePassword) -or
              [string]::IsNullOrWhiteSpace($signingLog)) {
            throw 'Inno signing environment is incomplete.'
          }

          & $signToolPath sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $certificatePath /p $certificatePassword $FilePath
          if ($LASTEXITCODE -ne 0) {
            throw "Authenticode signing failed for $FilePath."
          }

          & $signToolPath verify /pa /all /v $FilePath
          if ($LASTEXITCODE -ne 0) {
            throw "Authenticode verification failed for $FilePath."
          }

          [IO.File]::AppendAllText(
            $signingLog,
            [IO.Path]::GetFullPath($FilePath) + [Environment]::NewLine)
          '@ | Set-Content -LiteralPath $signingWrapper -Encoding utf8

          $innoSignCommand =
            '$q' + $powerShell.Source +
            '$q -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $q' +
            $signingWrapper +
            '$q $f'
          $compilerArguments = @(
            "/DVitaMoonlightSignedBuild",
            "/SVitaMoonlightReleaseAuthenticode=$innoSignCommand",
            "host\installer\VitaMoonlightHost.iss"
          )

          & $env:INNO_SETUP_COMPILER @compilerArguments
          if ($LASTEXITCODE -ne 0) {
            throw "Building the signed Windows installer failed."
          }

          if (-not (Test-Path -LiteralPath $signingLog)) {
            throw "Inno Setup did not invoke the configured SignTool."
          }
          $signedTargets = @(
            Get-Content -LiteralPath $signingLog |
              Where-Object { -not [string]::IsNullOrWhiteSpace($_) }
          )
          if ($signedTargets.Count -lt 2) {
            throw "Expected Inno Setup to sign Setup and its uninstaller; observed $($signedTargets.Count) signing target(s)."
          }
          Write-Host "Inno Setup produced and verified $($signedTargets.Count) signed target(s), including its uninstaller."
      - name: Remove installer signing material
        if: ${{ always() && env.HAS_WINDOWS_SIGNING_CERTIFICATE == 'true' }}
        shell: pwsh
        run: |
          $signingMaterial = @(
            "$env:RUNNER_TEMP\vita-moonlight-signing.pfx",
            "$env:RUNNER_TEMP\vita-moonlight-inno-sign.ps1",
            "$env:RUNNER_TEMP\vita-moonlight-inno-sign-targets.txt"
          )
          Remove-Item -LiteralPath $signingMaterial -Force -ErrorAction SilentlyContinue
          $remainingMaterial = @($signingMaterial | Where-Object { Test-Path -LiteralPath $_ })
          if ($remainingMaterial.Count -ne 0) {
            throw "Temporary Windows signing material could not be removed."
          }
      - name: Verify signed release artifacts
        if: env.HAS_WINDOWS_SIGNING_CERTIFICATE == 'true'
        shell: pwsh
        run: |
          $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if ($null -eq $signTool) { throw "signtool.exe was not found." }
          $signedFiles = @(
            "artifacts/host/VitaMoonlight.Host.exe",
            "artifacts/installer/Vita-Moonlight-Host-Setup-win-x64.exe"
          )
          foreach ($signedFile in $signedFiles) {
            & $signTool.FullName verify /pa /all /v $signedFile
            if ($LASTEXITCODE -ne 0) {
              throw "Authenticode verification failed for $signedFile."
            }
            $signature = Get-AuthenticodeSignature -LiteralPath $signedFile
            if ($signature.SignerCertificate.Subject -ne $env:WINDOWS_EXPECTED_SIGNER_SUBJECT) {
              throw "Unexpected Authenticode signer for $signedFile."
            }
            if ($null -eq $signature.TimeStamperCertificate) {
              throw "Authenticode timestamp is missing for $signedFile."
            }
          }
      - name: Verify unsigned artifacts
        if: env.HAS_WINDOWS_SIGNING_CERTIFICATE != 'true'
        shell: pwsh
        run: |
          $unsignedFiles = @(
            "artifacts/host/VitaMoonlight.Host.exe",
            "artifacts/installer/Vita-Moonlight-Host-Setup-win-x64.exe"
          )
          foreach ($unsignedFile in $unsignedFiles) {
            $signature = Get-AuthenticodeSignature -LiteralPath $unsignedFile
            if ($signature.Status.ToString() -ne 'NotSigned') {
              throw "Expected $unsignedFile to be unsigned, but its Authenticode status is $($signature.Status)."
            }
          }
          Write-Host 'Verified that the project-owned Windows artifacts are unsigned.'
      - name: Record Windows signing status
        shell: pwsh
        run: |
          $isSigned = $env:HAS_WINDOWS_SIGNING_CERTIFICATE -eq 'true'
          $artifactPaths = @(
            "artifacts/host/VitaMoonlight.Host.exe",
            "artifacts/installer/Vita-Moonlight-Host-Setup-win-x64.exe"
          )
          $files = foreach ($artifactPath in $artifactPaths) {
            $signature = Get-AuthenticodeSignature -LiteralPath $artifactPath
            [ordered]@{
              name = [IO.Path]::GetFileName($artifactPath)
              sha256 = (Get-FileHash -LiteralPath $artifactPath -Algorithm SHA256).Hash.ToLowerInvariant()
              authenticode_status = $signature.Status.ToString()
              signer_subject = if ($null -ne $signature.SignerCertificate) {
                $signature.SignerCertificate.Subject
              } else {
                $null
              }
              signer_thumbprint = if ($null -ne $signature.SignerCertificate) {
                $signature.SignerCertificate.Thumbprint
              } else {
                $null
              }
              timestamp_subject = if ($null -ne $signature.TimeStamperCertificate) {
                $signature.TimeStamperCertificate.Subject
              } else {
                $null
              }
            }
          }
          $manifest = [ordered]@{
            schema = 'vita-moonlight/windows-signing-status/v1'
            repository = $env:GITHUB_REPOSITORY
            source_commit = $env:GITHUB_SHA
            source_ref = $env:GITHUB_REF
            release_tag = if ($env:IS_TAGGED_RELEASE -eq 'true') {
              $env:GITHUB_REF_NAME
            } else {
              $null
            }
            mode = if ($isSigned) {
              'signed-release'
            } elseif ($env:IS_UNSIGNED_BETA_PREVIEW -eq 'true') {
              'unsigned-beta-preview'
            } else {
              'development-build'
            }
            files = @($files)
            generated_uninstaller = [ordered]@{
              signed = $isSigned
            }
          }
          $manifestJson = $manifest | ConvertTo-Json -Depth 5
          [IO.File]::WriteAllText(
            (Join-Path $PWD 'artifacts/installer/windows-signing-status.json'),
            $manifestJson + [Environment]::NewLine,
            [Text.UTF8Encoding]::new($false))
          Get-Content -LiteralPath artifacts/installer/windows-signing-status.json
      - name: Build portable archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts/portable/tools,artifacts/portable/host,artifacts/portable/docs -Force | Out-Null
          Copy-Item artifacts/host/* artifacts/portable -Recurse -Force
          Copy-Item artifacts/displaywizard artifacts/portable/tools/DisplayWizard -Recurse -Force
          Copy-Item artifacts/vigembus artifacts/portable/tools/ViGEmBus -Recurse -Force
          Copy-Item artifacts/sunshine artifacts/portable/tools/Sunshine -Recurse -Force
          New-Item -ItemType Directory -Path artifacts/portable/tools/SupportLog -Force | Out-Null
          Copy-Item tools/summarize-vita-log.py artifacts/portable/tools/SupportLog -Force
          Copy-Item README.md,PRIVACY.md,LICENSE artifacts/portable -Force
          Copy-Item artifacts/installer/windows-signing-status.json artifacts/portable -Force
          Copy-Item host/README.md,host/BETA_SMOKE_TEST.md,host/END_TO_END_TEST.md,host/FINAL_RELEASE_CHECKLIST.md,host/COMPATIBILITY.md,host/THIRD_PARTY_NOTICES.md artifacts/portable/host -Force
          Copy-Item docs/BUILDING.md,docs/COMMUNITY_TESTING.md,docs/LOGGING_AND_SUPPORT.md,docs/RELEASING.md,docs/CODE_SIGNING_POLICY.md,docs/VITA_SETTINGS_GUIDE.md artifacts/portable/docs -Force
          Compress-Archive -Path artifacts/portable/* -DestinationPath artifacts/installer/Vita-Moonlight-Host-Portable-win-x64.zip -CompressionLevel Optimal
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vita-moonlight-windows-host
          path: artifacts/installer/*
          if-no-files-found: error
