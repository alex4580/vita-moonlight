name: Release Vita Moonlight

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vita:
    uses: ./.github/workflows/cmake-psvita.yml

  windows-host:
    uses: ./.github/workflows/windows-host.yml
    secrets: inherit

  release:
    needs: [vita, windows-host]
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/**/*
